.stat { margin-left: auto; font-size: 12px; color: var(--muted); }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.dot-g { background: var(--green); }
.dot-a { background: #c49010; }
.dot-r { background: var(--red); }

/* TABLE WRAPPER */
.table-wrap { overflow-x: auto; padding: 0 28px 28px; }

/* TABLE */
table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
thead th {
  background: #f0eee9; padding: 10px 12px; text-align: left;

tbody tr:hover { background: #e8f0f7 !important; }

tbody.zebra tr:nth-child(even) { background: #f0f4f8; }
tbody.zebra tr:hover { background: inherit !important; }
tbody.zebra tr:nth-child(odd):hover { background: #ffffff !important; }
tbody.zebra tr:nth-child(even):hover { background: #f0f4f8 !important; }
tbody td { border-top: 1px solid #e8e5df; }

td.td-links { min-width: 60px; }
td.td-score { text-align: center; font-size: 18px; font-weight: 700; min-width: 56px; white-space: nowrap; }

td.td-score.mid { color: var(--amber); }
td.td-score.low { color: var(--red); }

.ans-short .ans-text { }
.ans-short .ans-more { color: var(--accent); font-size: 12px; cursor: pointer; margin-top: 4px; white-space: nowrap; }
.ans-full { display: none; }
.ans-full.open { display: block; }

.badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.badge-high { background: var(--green-bg); color: var(--green); }
.badge-mid { background: var(--amber-bg); color: var(--amber); }
.badge-low { background: var(--red-bg); color: var(--red); }

async function initDB() {
  try {
    const r = await fetch(GS_URL + '?action=getAll&secret=' + GS_SECRET);
    const data = await r.json();
    Object.keys(data).forEach(tg => {
      const d = data[tg];
      if (d.note) notes[tg] = d.note;
      if (d.status) statuses[tg] = d.status;
    });
    document.querySelectorAll('.note-input').forEach(inp => {
      const id = inp.dataset.id;
      if (notes[id] && inp !== document.activeElement) inp.value = notes[id];
    });
    document.querySelectorAll('.status-input').forEach(inp => {
      const id = inp.dataset.id;
      if (statuses[id] && inp !== document.activeElement) inp.value = statuses[id];
    });
  } catch(e) {}
}

async function saveNote(id, text) {
  try {
    await fetch(GS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ secret: GS_SECRET, tg: id, note: text })
    });
  } catch(e) {}
}

async function saveStatus(id, text) {
  try {
    await fetch(GS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ secret: GS_SECRET, tg: id, status: text })
    });
  } catch(e) {}
}

function tgLink(tg) {
  if (!tg || tg === 'Не указан') return '<span style="color:var(--muted)">—</span>';
  const raw = tg.trim();
  // phone number — не ссылка
  if (/^\+/.test(raw)) return `<span style="font-size:12px">${raw}</span>`;
  // вытаскиваем username
  let handle = raw
    .replace(/^@/, '')
    .replace(/^https?:\/\/t\.me\//, '')
    .replace(/^t\.me\//, '')
    .split(/[\s?]/)[0];
  if (!handle) return '<span style="color:var(--muted)">—</span>';
  return `<a class="tg-link" href="https://t.me/${handle}" target="_blank" rel="noopener" title="${raw}">@${handle}</a>`;
}

function profileLinks(links) {
  if (!links) return '';
  const parts = links.split('|').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return '';
  return parts.map((url, i) => `<a href="${url}" target="_blank" rel="noopener" style="font-size:12px">Профиль${parts.length > 1 ? ' ' + (i+1) : ''}</a>`).join(' · ');
}

function ansCell(text, id, q) {
  if (!text || text.length < 500) {
    return `<td class="td-answer"><div style="white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere">${esc(text || '—')}</div></td>`;
  }
  const short = esc(text.slice(0, 500)) + '…';
  const full = esc(text);
  const uid = id + '_' + q;
  return `<td class="td-answer">
    <div class="ans-short" id="s_${uid}">
      <div class="ans-text" style="white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere">${short}</div>
      <div class="ans-more" onclick="expand('${uid}')">читать полностью ▾</div>
    </div>
    <div class="ans-full" id="f_${uid}">
      <div style="white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere">${full}</div>
      <div class="ans-collapse" onclick="collapse('${uid}')">свернуть ▴</div>
    </div>
  </td>`;
}

function expand(uid) {
  document.getElementById('s_' + uid).style.display = 'none';
  document.getElementById('f_' + uid).classList.add('open');
}
function collapse(uid) {
  document.getElementById('s_' + uid).style.display = '';
  document.getElementById('f_' + uid).classList.remove('open');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  let data = [...RAW];
  if (searchStr) {
    const q = searchStr.toLowerCase();
    data = data.filter(c => c.name.toLowerCase().includes(q) || c.tg.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q));
  }
  data.sort((a, b) => {
    if (sortCol === 'direction') {
      const rank = c => { const d = DIRECTIONS[c.tg] || []; return d.includes(directionFirst) ? (d.length === 1 ? 0 : 1) : d.length ? 2 : 3; };
      return rank(a) - rank(b) || a.name.localeCompare(b.name, 'ru');
    }
    const va = sortCol === 'direction' ? (DIRECTIONS[a.tg] || []).join(', ') : String(a[sortCol] || '');
    const vb = sortCol === 'direction' ? (DIRECTIONS[b.tg] || []).join(', ') : String(b[sortCol] || '');
    return sortAsc ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  data.forEach(c => {
    const id = c.tg.replace(/[^a-zA-Z0-9]/g, '_').slice(0,30) + '_' + c.name.slice(0,10).replace(/[^a-zA-Z0-9а-яА-Я]/g,'');
    const note = notes[id] || '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-name" style="min-width:140px;word-break:break-word">
        ${esc(c.name)}<br>${tgLink(c.tg)}
        ${c.links ? '<br><span style="font-size:11px">' + profileLinks(c.links) + '</span>' : ''}
      </td>
      ${ansCell((c.q3 || '') + (c.q6 ? '\n\nОпыт с текстами и рассылками: ' + c.q6 : ''), id, 'q3')}
      ${ansCell(c.q4, id, 'q4')}
      ${ansCell(c.q5, id, 'q5')}
      <td style="min-width:130px">${(DIRECTIONS[c.tg] || []).map(d => `<span class="direction-tag">${esc(d)}</span>`).join('') || '<span style="color:var(--muted)">Не определено</span>'}</td>
      <td style="min-width:80px;width:90px;font-size:12px;color:var(--muted);word-break:break-word">${esc(c.pay)}</td>
      <td class="td-summary">${c.summaryHtml}</td>
      <td class="td-note" style="white-space:pre-wrap">${esc(USER_COMMENTS[c.tg] || "")}</td><td class="td-note">
        <textarea class="note-input" data-id="${id}" placeholder="Заметка Оли…">${esc(note)}</textarea>
        <div class="note-saved" id="ns_${id}">Сохранено</div>
      </td>
      <td class="td-note">
        <textarea class="status-input" data-id="${id}" placeholder="Статус…" style="min-height:72px">${esc(statuses[id] || '')}</textarea>
        <div class="note-saved" id="ss_${id}">Сохранено</div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // attach note listeners
  document.querySelectorAll('.note-input').forEach(inp => {
    let timer;
    inp.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const id = inp.dataset.id;
        notes[id] = inp.value;
        await saveNote(id, inp.value);
        const ns = document.getElementById('ns_' + id);
        if (ns) { ns.classList.add('show'); setTimeout(() => ns.classList.remove('show'), 1500); }
      }, 600);
    });
  });

  // attach status listeners
  document.querySelectorAll('.status-input').forEach(inp => {
    let timer;
    inp.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const id = inp.dataset.id;
        statuses[id] = inp.value;
        await saveStatus(id, inp.value);
        const ss = document.getElementById('ss_' + id);
        if (ss) { ss.classList.add('show'); setTimeout(() => ss.classList.remove('show'), 1500); }
      }, 600);
    });
  });

  document.getElementById('stat').textContent = `Показано: ${data.length} из ${RAW.length}`;

  document.querySelectorAll('thead [data-col]').forEach(th => {
    th.classList.remove('sorted');
    const si = th.querySelector('.si');
    if (si) si.textContent = '↕';
    if (th.dataset.col === sortCol) {
      th.classList.add('sorted');
      if (si) si.textContent = sortCol === 'direction' ? ' · сначала ' + directionFirst : (sortAsc ? '↑' : '↓');
    }
  });
}

document.querySelectorAll('thead [data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (col === 'direction') { if (sortCol === 'direction') directionFirst = directionFirst === 'Соцсети' ? 'Email' : 'Соцсети'; sortCol = 'direction'; }
    else if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = false; }
    render();
  });
});

document.querySelector('.sort-direction').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.click(); } });

  } else {
    tbody.classList.remove('zebra');
    btn.style.background = 'var(--bg)';
    btn.style.color = 'var(--text-muted)';
    btn.style.borderColor = 'var(--border)';
    btn.textContent = '⬜ Полосы';
  }
}
</script>
</body>
